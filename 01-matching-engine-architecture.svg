ata-h="35"><rect x="968.327392578125" y="650.5" width="81.34521484375" height="35" rx="17.5" fill="#121314" stroke="#68a9e0" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1009" y="673.78">push</tspan></text></g><path data-connector="true" data-edge="gateway-client" data-from="gateway" data-to="client" d="M 1888 340 V 752 H 286 V 198 H 264" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/><g data-edge-caption="gateway-client" data-container="Socket: realtime" data-x="999.253662109375" data-y="734.5" data-w="175.49267578125" data-h="35"><rect x="999.253662109375" y="734.5" width="175.49267578125" height="35" rx="17.5" fill="#121314" stroke="#68a9e0" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1087" y="757.78">Socket: realtime</tspan></text></g><g data-component="client" data-container="Client: Web / Admin" data-x="18" data-y="104" data-w="246" data-h="128"><rect x="18" y="104" width="246" height="128" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="141" y="174.8">Client: Web / Admin</tspan></text></g><g data-component="core" data-container="core-api" data-x="577" data-y="56" data-w="328" data-h="168"><rect x="577" y="56" width="328" height="168" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="22" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="741" y="147.48">core-api</tspan></text></g><g data-component="postgres" data-container="PostgreSQL" data-x="1311" data-y="64" data-w="154" data-h="100"><path d="M 1311 79 V 149 C 1311 169 1465 169 1465 149 V 79 Z" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><ellipse cx="1388" cy="79" rx="77" ry="15" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="18" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1388" y="127">PostgreSQL</tspan></text></g><g data-component="redis" data-container="Redis" data-x="1355" data-y="232" data-w="134" data-h="100"><path d="M 1355 247 V 317 C 1355 337 1489 337 1489 317 V 247 Z" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><ellipse cx="1422" cy="247" rx="67" ry="15" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="18" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1422" y="295">Redis</tspan></text></g><g data-component="gateway" data-container="signaling-gateway" data-x="1752" data-y="232" data-w="272" data-h="108"><rect x="1752" y="232" width="272" height="108" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1888" y="292.8">signaling-gateway</tspan></text></g><g data-component="push" data-container="FCM / APNs / Web Push" data-x="1311" data-y="380" data-w="300" data-h="92"><rect x="1311" y="380" width="300" height="92" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1461" y="432.8">FCM / APNs / Web Push</tspan></text></g><g data-component="broker" data-container="Kafka" data-x="1311" data-y="512" data-w="300" data-h="92"><rect x="1311" y="512" width="300" height="92" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1461" y="564.8">Kafka</tspan></text></g><line x1="28" x2="2020" y1="838" y2="838" stroke="#343a40" stroke-width="1"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="880">Điểm quan trọng</tspan></text><g data-note="important"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="912">Matching là module trong core-api. PostgreSQL giữ ticket, quota và session; Redis Sorted Set giữ hàng đợi cùng shard index, Pub/Sub vận chuyển event sau commit.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="962">Lưu ý</tspan></text><g data-note="caution"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="994">Matcher phải kiểm tra lại ticket, user status, gender preference hai chiều và Safety trong transaction. Một user không được có nhiều ticket active; Redis không thay PostgreSQL làm nguồn state. Kafka/stream chỉ khi</tspan><tspan x="28" y="1022">Economy outbox relay được bật; không khẳng định có consumer nghiệp vụ. Push cần provider/credential và endpoint phù hợp; in-app vẫn ở PostgreSQL.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="400" text-anchor="start" fill="#68a9e0"><tspan x="28" y="1074">Nguồn: docs/services/matching-service.md · docs/services/realtime-gateway.md · apps/core-api/src/modules/matching/matching.module.ts · Chi tiết: render-verification.json</tspan></text></svg>