data-component="storage" data-container="S3 / R2 / MinIO" data-x="1311" data-y="380" data-w="300" data-h="92"><rect x="1311" y="380" width="300" height="92" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1461" y="432.8">S3 / R2 / MinIO</tspan></text></g><g data-component="push" data-container="FCM / APNs / Web Push" data-x="1311" data-y="512" data-w="300" data-h="92"><rect x="1311" y="512" width="300" height="92" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1461" y="564.8">FCM / APNs / Web Push</tspan></text></g><line x1="28" x2="2020" y1="886" y2="886" stroke="#343a40" stroke-width="1"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="928">Điểm quan trọng</tspan></text><g data-note="important"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="960">Feed truy vấn PostgreSQL; audience và block được áp dụng trong core-api. Ảnh upload trực tiếp qua storage, Media kiểm tra owner, metadata và magic bytes trước khi lưu URL final; Story là entity riêng có expiresAt.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="1010">Lưu ý</tspan></text><g data-note="caution"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="1042">Feed toàn cục chỉ public; timeline profile lọc audience theo quan hệ. Flow đọc post/story dùng REST, không có fanout feed riêng; reply Story đi tiếp qua Friend Chat với realtime của Friend. Push cần provider/credential</tspan><tspan x="28" y="1070">và endpoint phù hợp; in-app vẫn ở PostgreSQL.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="400" text-anchor="start" fill="#68a9e0"><tspan x="28" y="1122">Nguồn: docs/services/feed-service.md · docs/services/media-service.md · apps/core-api/src/modules/feed/feed.module.ts · Chi tiết: render-verification.json</tspan></text></svg>