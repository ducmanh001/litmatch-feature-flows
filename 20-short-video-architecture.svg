serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1461" y="288.8">VideoStoragePort</tspan></text></g><g data-component="transcode" data-container="VideoTranscodePort" data-x="1311" data-y="368" data-w="300" data-h="92"><rect x="1311" y="368" width="300" height="92" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1461" y="420.8">VideoTranscodePort</tspan></text></g><g data-component="push" data-container="FCM / APNs / Web Push" data-x="1311" data-y="500" data-w="300" data-h="92"><rect x="1311" y="500" width="300" height="92" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1461" y="552.8">FCM / APNs / Web Push</tspan></text></g><g data-component="broker" data-container="Kafka" data-x="1311" data-y="632" data-w="300" data-h="92"><rect x="1311" y="632" width="300" height="92" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1461" y="684.8">Kafka</tspan></text></g><line x1="28" x2="2020" y1="922" y2="922" stroke="#343a40" stroke-width="1"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="964">Điểm quan trọng</tspan></text><g data-note="important"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="996">ShortVideo module giữ lifecycle và interactions trong PostgreSQL; body video upload trực tiếp lên storage. Storage/transcode là ports hạ tầng của core-api, không phải backend business deployable mới.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="1046">Lưu ý</tspan></text><g data-note="caution"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="1078">Repo có dev adapters và production view-only/unavailable; chưa có vendor storage/transcode thật cho video. VIDEO_UPLOAD_ENABLED và runtime capabilities chặn upload trước side effect; không suy provider ready từ</tspan><tspan x="28" y="1106">sơ đồ. Kafka/stream chỉ khi Economy outbox relay được bật; không khẳng định có consumer nghiệp vụ. Video storage/transcode hiện là dev/unavailable adapters; production vendor và webhook transcode chưa có. Push</tspan><tspan x="28" y="1134">cần provider/credential và endpoint phù hợp; in-app vẫn ở PostgreSQL.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="400" text-anchor="start" fill="#68a9e0"><tspan x="28" y="1186">Nguồn: docs/services/short-video-service.md · docs/services/gift-service.md · apps/core-api/src/modules/short-video/short-video.module.ts · Chi tiết: render-verification.json</tspan></text></svg>