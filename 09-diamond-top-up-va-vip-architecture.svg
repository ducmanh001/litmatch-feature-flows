xt-anchor="middle" fill="#83c3ff"><tspan x="741" y="159.48">core-api</tspan></text></g><g data-component="postgres" data-container="PostgreSQL" data-x="1311" data-y="64" data-w="154" data-h="100"><path d="M 1311 79 V 149 C 1311 169 1465 169 1465 149 V 79 Z" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><ellipse cx="1388" cy="79" rx="77" ry="15" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="18" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1388" y="127">PostgreSQL</tspan></text></g><g data-component="payos" data-container="payOS" data-x="1311" data-y="236" data-w="300" data-h="92"><rect x="1311" y="236" width="300" height="92" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1461" y="288.8">payOS</tspan></text></g><g data-component="apple-iap" data-container="Apple App Store" data-x="1311" data-y="368" data-w="300" data-h="92"><rect x="1311" y="368" width="300" height="92" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1461" y="420.8">Apple App Store</tspan></text></g><g data-component="google-iap" data-container="Google Play" data-x="1311" data-y="500" data-w="300" data-h="92"><rect x="1311" y="500" width="300" height="92" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1461" y="552.8">Google Play</tspan></text></g><g data-component="broker" data-container="Kafka" data-x="1311" data-y="632" data-w="300" data-h="92"><rect x="1311" y="632" width="300" height="92" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1461" y="684.8">Kafka</tspan></text></g><line x1="28" x2="2020" y1="970" y2="970" stroke="#343a40" stroke-width="1"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="1012">Điểm quan trọng</tspan></text><g data-note="important"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="1044">Economy và Ledger là module nội bộ core-api. PostgreSQL giữ Transaction DB-unique idempotencyKey, LedgerEntry double-entry append-only và Wallet snapshot; outbox ghi cùng transaction, relay Kafka chỉ khi bật.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="1094">Lưu ý</tspan></text><g data-note="caution"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="1126">Provider phải xác minh server-side trước credit; credential/config quyết định availability. Ledger cũ có DB trigger chặn sửa/xoá, corrections dùng reversal; Redis không phải nguồn số dư. Kafka/stream chỉ khi Economy</tspan><tspan x="28" y="1154">outbox relay được bật; không khẳng định có consumer nghiệp vụ.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="400" text-anchor="start" fill="#68a9e0"><tspan x="28" y="1206">Nguồn: docs/services/economy-service.md · apps/core-api/src/modules/economy/economy.controller.ts · apps/core-api/src/modules/economy/economy.module.ts · Chi tiết: render-verification.json</tspan></text></svg>