<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="773" viewBox="0 0 2048 773" role="img" aria-label="Notification — Sơ đồ kiến trúc"><title>Notification — Sơ đồ kiến trúc</title><rect width="100%" height="100%" fill="#121314"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#666666" stroke-width="1.4"/></marker></defs><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="26" font-weight="700" text-anchor="start" fill="#83c3ff"><tspan x="24" y="38">Notification — Sơ đồ kiến trúc</tspan></text><path data-connector="true" data-edge="client-core" data-from="client" data-to="core" d="M 264 140 H 577" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-edge-caption="client-core" data-container="REST: yêu cầu nghiệp vụ" data-x="298.0771484375" data-y="122.5" data-w="244.845703125" data-h="35"><rect x="298.0771484375" y="122.5" width="244.845703125" height="35" rx="17.5" fill="#121314" stroke="#68a9e0" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="420.5" y="145.78">REST: yêu cầu nghiệp vụ</tspan></text></g><path data-connector="true" data-edge="core-postgres" data-from="core" data-to="postgres" d="M 905 100 H 1311" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-edge-caption="core-postgres" data-container="state bền vững" data-x="1025.3876953125" data-y="82.5" data-w="165.224609375" data-h="35"><rect x="1025.3876953125" y="82.5" width="165.224609375" height="35" rx="17.5" fill="#121314" stroke="#68a9e0" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1108" y="105.78">state bền vững</tspan></text></g><path data-connector="true" data-edge="core-push" data-from="core" data-to="push" d="M 905 124 H 1074 V 282 H 1311" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-edge-caption="core-push" data-container="push" data-x="1151.827392578125" data-y="264.5" data-w="81.34521484375" data-h="35"><rect x="1151.827392578125" y="264.5" width="81.34521484375" height="35" rx="17.5" fill="#121314" stroke="#68a9e0" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1192.5" y="287.78">push</tspan></text></g><path data-connector="true" data-edge="client-push" data-from="push" data-to="client" d="M 1611 300 H 1708 V 392 H 310 V 174 H 264" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-edge-caption="client-push" data-container="push" data-x="968.327392578125" data-y="374.5" data-w="81.34521484375" data-h="35"><rect x="968.327392578125" y="374.5" width="81.34521484375" height="35" rx="17.5" fill="#121314" stroke="#68a9e0" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1009" y="397.78">push</tspan></text></g><g data-component="client" data-container="Client: Web / Admin" data-x="18" data-y="104" data-w="246" data-h="104"><rect x="18" y="104" width="246" height="104" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="141" y="162.8">Client: Web / Admin</tspan></text></g><g data-component="core" data-container="core-api" data-x="577" data-y="56" data-w="328" data-h="152"><rect x="577" y="56" width="328" height="152" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="22" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="741" y="139.48">core-api</tspan></text></g><g data-component="postgres" data-container="PostgreSQL" data-x="1311" data-y="64" data-w="154" data-h="100"><path d="M 1311 79 V 149 C 1311 169 1465 169 1465 149 V 79 Z" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><ellipse cx="1388" cy="79" rx="77" ry="15" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="18" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1388" y="127">PostgreSQL</tspan></text></g><g data-component="push" data-container="FCM / APNs / Web Push" data-x="1311" data-y="236" data-w="300" data-h="92"><rect x="1311" y="236" width="300" height="92" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1461" y="288.8">FCM / APNs / Web Push</tspan></text></g><line x1="28" x2="2020" y1="478" y2="478" stroke="#343a40" stroke-width="1"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="520">Điểm quan trọng</tspan></text><g data-note="important"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="552">Notification là module core-api, nhận trigger qua DI và lưu row in-app trong PostgreSQL. Khi có shared transaction, notification atomic cùng hành động gốc; Friend message dùng transaction riêng best-effort sau persist.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="602">Lưu ý</tspan></text><g data-note="caution"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="634">Flow này không dùng Outbox/Kafka hay Redis queue để tạo notification. Push provider là side effect sau commit; disabled adapter vẫn giữ in-app rows, lỗi push không rollback nghiệp vụ. Push cần provider/credential và</tspan><tspan x="28" y="662">endpoint phù hợp; in-app vẫn ở PostgreSQL.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="400" text-anchor="start" fill="#68a9e0"><tspan x="28" y="714">Nguồn: docs/services/notification-service.md · docs/services/friend-service.md · apps/core-api/src/modules/notification/notification.module.ts · Chi tiết: render-verification.json</tspan></text></svg>