an></text></g><line x1="32" x2="1176" y1="1855" y2="1855" stroke="#343a40" stroke-width="1"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="24" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="32" y="1907">Điểm quan trọng</tspan></text><g data-note="important"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="23" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="32" y="1944">Availability là read-only projection của runtime config, không ghi vào PostgreSQL hay Redis. Apple và Google</tspan><tspan x="32" y="1977">có trạng thái riêng; không suy cả hai đều sẵn sàng từ một provider.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="24" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="32" y="2038">Lưu ý</tspan></text><g data-note="caution"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="23" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="32" y="2075">Không PG/Redis write, không provider network probe; configured enabled không đảm bảo request provider</tspan><tspan x="32" y="2108">thành công hay production readiness.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="400" text-anchor="start" fill="#68a9e0"><tspan x="32" y="2171">Nguồn: apps/core-api/src/app/capabilities.controller.ts · apps/core-api/src/app/capabilities.service.ts</tspan></text></svg>