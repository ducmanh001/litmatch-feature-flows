or="middle" fill="#83c3ff"><tspan x="1108" y="105.78">state bền vững</tspan></text></g><path data-connector="true" data-edge="core-redis" data-from="redis" data-to="core" d="M 1355 282 H 1074 V 124 H 905" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-edge-caption="core-redis" data-container="presence" data-x="1156.23388671875" data-y="264.5" data-w="116.5322265625" data-h="35"><rect x="1156.23388671875" y="264.5" width="116.5322265625" height="35" rx="17.5" fill="#121314" stroke="#68a9e0" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1214.5" y="287.78">presence</tspan></text></g><g data-component="client" data-container="Client: Web / Admin" data-x="18" data-y="104" data-w="246" data-h="100"><rect x="18" y="104" width="246" height="100" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="141" y="160.8">Client: Web / Admin</tspan></text></g><g data-component="core" data-container="core-api" data-x="577" data-y="56" data-w="328" data-h="152"><rect x="577" y="56" width="328" height="152" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="22" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="741" y="139.48">core-api</tspan></text></g><g data-component="postgres" data-container="PostgreSQL" data-x="1311" data-y="64" data-w="154" data-h="100"><path d="M 1311 79 V 149 C 1311 169 1465 169 1465 149 V 79 Z" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><ellipse cx="1388" cy="79" rx="77" ry="15" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="18" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1388" y="127">PostgreSQL</tspan></text></g><g data-component="redis" data-container="Redis" data-x="1355" data-y="232" data-w="134" data-h="100"><path d="M 1355 247 V 317 C 1355 337 1489 337 1489 317 V 247 Z" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><ellipse cx="1422" cy="247" rx="67" ry="15" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="18" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1422" y="295">Redis</tspan></text></g><line x1="28" x2="2020" y1="418" y2="418" stroke="#343a40" stroke-width="1"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="460">Điểm quan trọng</tspan></text><g data-note="important"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="492">User và PrivacySetting thuộc PostgreSQL. Profile update validate tại backend; privacy PUT lưu đầy đủ bốn cờ. UserPresenceReader đọc Redis presence do signaling-gateway ghi, không tự quyết user online.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="542">Lưu ý</tspan></text><g data-note="caution"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="574">hideProfile không làm GET /users/:id thành endpoint có block/privacy gate; controller hiện trả PublicProfileDto trực tiếp. showDistance tác động Nearby bucket, searchableByPhone tác động phone search; không suy</tspan><tspan x="28" y="602">quyền toàn hệ thống từ một cờ.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="400" text-anchor="start" fill="#68a9e0"><tspan x="28" y="654">Nguồn: apps/core-api/src/modules/user/user.controller.ts · apps/core-api/src/modules/user/user.service.ts · apps/core-api/src/modules/user/services/privacy-settings.service.ts · Chi tiết: render-verification.json</tspan></text></svg>