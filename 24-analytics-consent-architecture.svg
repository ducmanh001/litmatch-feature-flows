<svg xmlns="http://www.w3.org/2000/svg" width="1208" height="634" viewBox="0 0 1208 634" role="img" aria-label="Analytics và thông báo privacy — Sơ đồ kiến trúc"><title>Analytics và thông báo privacy — Sơ đồ kiến trúc</title><rect width="100%" height="100%" fill="#121314"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#666666" stroke-width="1.4"/></marker></defs><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="26" font-weight="700" text-anchor="start" fill="#83c3ff"><tspan x="24" y="38">Analytics và thông báo privacy — Sơ đồ kiến trúc</tspan></text><path data-connector="true" data-edge="client-provider" data-from="client" data-to="analytics" d="M 264 150 H 870" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-edge-caption="client-provider" data-container="HTTPS · analytics" data-x="476.17822265625" data-y="132.5" data-w="181.6435546875" data-h="35"><rect x="476.17822265625" y="132.5" width="181.6435546875" height="35" rx="17.5" fill="#121314" stroke="#68a9e0" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="567" y="155.78">HTTPS · analytics</tspan></text></g><g data-component="client" data-container="Frontend · Web" data-x="18" data-y="100" data-w="246" data-h="100"><rect x="18" y="100" width="246" height="100" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="141" y="156.8">Frontend · Web</tspan></text></g><g data-component="analytics" data-container="PostHog" data-x="870" data-y="100" data-w="310" data-h="100"><rect x="870" y="100" width="310" height="100" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1025" y="156.8">PostHog</tspan></text></g><line x1="28" x2="1180" y1="286" y2="286" stroke="#343a40" stroke-width="1"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="328">Điểm quan trọng</tspan></text><g data-note="important"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="360">Telemetry hiện được khởi tạo trực tiếp trong browser khi có PostHog config. Frontend gửi pageview/autocapture, identity và</tspan><tspan x="28" y="388">Core Web Vitals sample; flow này không đi qua core-api, PostgreSQL hoặc Redis.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="438">Lưu ý</tspan></text><g data-note="caution"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="470">Mục privacy hiện hiển thị switch luôn bật khi configured và không có handler đổi consent. Consent cookie/helper tồn tại</tspan><tspan x="28" y="498">nhưng startup không kiểm cookie đó; server AnalyticsPort không có domain call site hiện hành.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="400" text-anchor="start" fill="#68a9e0"><tspan x="28" y="550">Nguồn: apps/web/src/instrumentation-client.ts · apps/web/src/shared/analytics/product-analytics.ts ·</tspan><tspan x="28" y="575">apps/web/src/shared/analytics/product-analytics-components.tsx · Chi tiết: render-verification.json</tspan></text></svg>