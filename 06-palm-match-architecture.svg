<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="561" viewBox="0 0 2048 561" role="img" aria-label="Palm Match — Sơ đồ kiến trúc"><title>Palm Match — Sơ đồ kiến trúc</title><rect width="100%" height="100%" fill="#121314"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#666666" stroke-width="1.4"/></marker></defs><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="26" font-weight="700" text-anchor="start" fill="#83c3ff"><tspan x="24" y="38">Palm Match — Sơ đồ kiến trúc</tspan></text><path data-connector="true" data-edge="client-core" data-from="client" data-to="core" d="M 264 140 H 577" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-edge-caption="client-core" data-container="REST: yêu cầu nghiệp vụ" data-x="298.0771484375" data-y="122.5" data-w="244.845703125" data-h="35"><rect x="298.0771484375" y="122.5" width="244.845703125" height="35" rx="17.5" fill="#121314" stroke="#68a9e0" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="420.5" y="145.78">REST: yêu cầu nghiệp vụ</tspan></text></g><path data-connector="true" data-edge="core-postgres" data-from="core" data-to="postgres" d="M 905 100 H 1311" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-edge-caption="core-postgres" data-container="state bền vững · queue" data-x="992.3671875" data-y="82.5" data-w="231.265625" data-h="35"><rect x="992.3671875" y="82.5" width="231.265625" height="35" rx="17.5" fill="#121314" stroke="#68a9e0" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1108" y="105.78">state bền vững · queue</tspan></text></g><g data-component="client" data-container="Client: Web / Admin" data-x="18" data-y="104" data-w="246" data-h="100"><rect x="18" y="104" width="246" height="100" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="141" y="160.8">Client: Web / Admin</tspan></text></g><g data-component="core" data-container="core-api" data-x="577" data-y="56" data-w="328" data-h="152"><rect x="577" y="56" width="328" height="152" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="22" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="741" y="139.48">core-api</tspan></text></g><g data-component="postgres" data-container="PostgreSQL" data-x="1311" data-y="64" data-w="154" data-h="100"><path d="M 1311 79 V 149 C 1311 169 1465 169 1465 149 V 79 Z" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><ellipse cx="1388" cy="79" rx="77" ry="15" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="18" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1388" y="127">PostgreSQL</tspan></text></g><line x1="28" x2="2020" y1="294" y2="294" stroke="#343a40" stroke-width="1"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="336">Điểm quan trọng</tspan></text><g data-note="important"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="368">Bài đọc chọn từ templates trong PostgreSQL bằng seed user, category và ngày UTC. Flow ghép ẩn danh có queue và session snapshot trong cùng module PalmMatch; matcher dùng advisory lock PostgreSQL.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="418">Lưu ý</tspan></text><g data-note="caution"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="450">Không dùng AI provider, Economy hay service ghép riêng. Redis không giữ queue Palm; client lấy current state qua REST. Reading không có lịch sử riêng, còn session snapshot giữ kết quả ghép để reload.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="400" text-anchor="start" fill="#68a9e0"><tspan x="28" y="502">Nguồn: docs/services/palm-match-service.md · apps/core-api/src/modules/palm-match/palm-match.service.ts · apps/core-api/src/modules/palm-match/palm-match.module.ts · Chi tiết: render-verification.json</tspan></text></svg>