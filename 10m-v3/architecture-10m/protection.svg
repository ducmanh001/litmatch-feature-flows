<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 860" width="1280" height="860" role="img" aria-label="Bảo vệ tài nguyên: admission HTTP, timeout, readiness, HPA/PDB" font-family="-apple-system,Segoe UI,Noto Sans,Helvetica,Arial,sans-serif">
<title>Bảo vệ tài nguyên: admission HTTP, timeout, readiness, HPA/PDB</title>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--border:#d1d9e0;--subtle:#f6f8fa;--accent:#0969da;--ok:#1a7f37;--warn:#bc4c00;
--t-controller:#1a7f37;--t-service:#bc4c00;--t-worker:#8250df;--t-postgres:#0969da;--t-redis:#cf222e;--t-kafka:#57606a;--t-external:#0a7a6b;--t-gateway:#9a6700}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#8b949e;--border:#30363d;--subtle:#161b22;--accent:#4493f8;--ok:#56d364;--warn:#ffa657;
--t-controller:#56d364;--t-service:#ffa657;--t-worker:#d2a8ff;--t-postgres:#58a6ff;--t-redis:#ff7b72;--t-kafka:#c9d1d9;--t-external:#39d0bb;--t-gateway:#e3b341}}
.bg{fill:var(--bg)}
.ttl{font:700 17px -apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--fg)}
.sub{font:12px -apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--muted)}
.nt{font:700 13px -apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--fg)}
.nl{font:11.5px -apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--muted)}
.gt{font:600 12px -apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--muted)}
.el{font:600 11px -apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--fg)}
.lg{font:11.5px -apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--muted)}
.node{fill:var(--subtle);stroke-width:1.6}
.node.ops{stroke-dasharray:5 4}
.grp{fill:none;stroke:var(--border);stroke-width:1.2;stroke-dasharray:6 4}
.edge{fill:none;stroke-width:1.6;stroke-linejoin:round}
.edge.async{stroke-dasharray:6 4}
.pill{fill:var(--bg);stroke-width:1}
.tag{font:700 10px -apple-system,"Segoe UI",sans-serif}
.tagbg{stroke-width:1}
a:hover .nt{text-decoration:underline}</style>
<defs>
<marker id="ah-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>
<marker id="ah-gateway" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t-gateway)"/></marker>
<marker id="ah-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t-service)"/></marker>
<marker id="ah-worker" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t-worker)"/></marker>
<marker id="ah-postgres" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t-postgres)"/></marker>
<marker id="ah-redis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t-redis)"/></marker>
<marker id="ah-kafka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t-kafka)"/></marker>
<marker id="ah-external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t-external)"/></marker>
<marker id="ah-ops" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1280" height="860"/>
<text class="ttl" x="24" y="30">Bảo vệ tài nguyên: admission HTTP, timeout, readiness, HPA/PDB</text>
<text class="sub" x="24" y="50">Mọi giới hạn đều hữu hạn và không có hàng chờ ở ứng dụng; số trên sơ đồ là mặc định cấu hình, chưa phải năng lực đã đo.</text>
<rect class="grp" x="270" y="84" width="580" height="496" rx="12"/>
<text class="gt" x="284" y="104">core-api (một pod)</text>
<path class="edge" d="M135,192 L135,260" stroke="var(--muted)" marker-end="url(#ah-client)"/>
<path class="edge" d="M230,308 L242,308 Q250,308 250,300 L250,182 Q250,174 258,174 L295,174" stroke="var(--t-service)" marker-end="url(#ah-service)"/>
<path class="edge" d="M560,224 L560,262" stroke="var(--t-service)" marker-end="url(#ah-service)"/>
<path class="edge" d="M825,297 L866.5,297 Q870,297 870,293.5 L870,293.5 Q870,290 873.5,290 L900,290" stroke="var(--t-postgres)" marker-end="url(#ah-postgres)"/>
<path class="edge" d="M825,422 L862,422 Q870,422 870,414 L870,378 Q870,370 878,370 L900,370" stroke="var(--t-postgres)" marker-end="url(#ah-postgres)"/>

<rect class="node" stroke="var(--muted)" x="40" y="112" width="190" height="80" rx="9"/>
<text class="nt" text-anchor="middle" x="135" y="136">Client</text>
<text class="nl" text-anchor="middle" x="135" y="154">REST từ web / admin</text>


<rect class="node ops" stroke="var(--muted)" x="40" y="260" width="190" height="96" rx="9"/>
<text class="nt" text-anchor="middle" x="135" y="284">Ingress / LB</text>
<text class="nl" text-anchor="middle" x="135" y="302">giới hạn kết nối và rate</text>
<text class="nl" text-anchor="middle" x="135" y="318">nằm ngoài code, vẫn cần</text>

<a href="../code-10m/38-runtime-protection/01-http-request-admission.html">
<rect class="node" stroke="var(--t-service)" x="295" y="124" width="530" height="100" rx="9"/>
<text class="nt" text-anchor="middle" x="560" y="148">Admission HTTP: RequestConcurrencyInterceptor</text>
<text class="nl" text-anchor="middle" x="560" y="166">HTTP_MAX_CONCURRENT_REQUESTS (0 → 4 × DATABASE_POOL_MAX = 40)</text>
<text class="nl" text-anchor="middle" x="560" y="182">hết chỗ → 503 + Retry-After: 1, không hàng chờ ứng dụng</text>
<text class="nl" text-anchor="middle" x="560" y="198">slot nhả khi xong, lỗi hoặc bị huỷ; health được miễn</text>
</a>
<rect class="tagbg" x="777" y="116" width="42" height="16" rx="8" fill="var(--bg)" stroke="var(--warn)"/>
<text class="tag" text-anchor="middle" x="798" y="127.5" fill="var(--warn)">local</text>

<rect class="node" stroke="var(--t-service)" x="295" y="262" width="530" height="70" rx="9"/>
<text class="nt" text-anchor="middle" x="560" y="286">Handlers: controller → service → repository</text>
<text class="nl" text-anchor="middle" x="560" y="304">mỗi request giữ ít kết nối pool nhất có thể</text>

<a href="../code-10m/38-runtime-protection/02-get-health-ready.html">
<rect class="node" stroke="var(--t-service)" x="295" y="372" width="530" height="100" rx="9"/>
<text class="nt" text-anchor="middle" x="560" y="396">Readiness: GET /health/ready</text>
<text class="nl" text-anchor="middle" x="560" y="414">kết quả cache 1 s, các probe song song được gộp</text>
<text class="nl" text-anchor="middle" x="560" y="430">tối đa MỘT SQL probe chưa xong (không làm đầy pool)</text>
<text class="nl" text-anchor="middle" x="560" y="446">Postgres và Redis đều up mới ready</text>
</a>
<rect class="tagbg" x="777" y="364" width="42" height="16" rx="8" fill="var(--bg)" stroke="var(--warn)"/>
<text class="tag" text-anchor="middle" x="798" y="375.5" fill="var(--warn)">local</text>
<a href="../code-10m/32-data-lifecycle/01-job-retention-tick.html">
<rect class="node" stroke="var(--t-worker)" x="295" y="500" width="530" height="62" rx="9"/>
<text class="nt" text-anchor="middle" x="560" y="524">Job nền: admission FIFO + ngân sách</text>
<text class="nl" text-anchor="middle" x="560" y="542">làn thường và làn critical theo pool; xem trang Vòng đời dữ liệu</text>
</a>
<rect class="tagbg" x="777" y="492" width="42" height="16" rx="8" fill="var(--bg)" stroke="var(--warn)"/>
<text class="tag" text-anchor="middle" x="798" y="503.5" fill="var(--warn)">local</text>

<path class="node" stroke="var(--t-postgres)" d="M900,158 a170,8 0 0 1 340,0 v264 a170,8 0 0 1 -340,0 z"/>
<path class="node" stroke="var(--t-postgres)" fill="none" d="M900,158 a170,8 0 0 0 340,0"/>
<text class="nt" text-anchor="middle" x="1070" y="182">PostgreSQL</text>
<text class="nl" text-anchor="middle" x="1070" y="200">DATABASE_STATEMENT_TIMEOUT_MS = 15 s:</text>
<text class="nl" text-anchor="middle" x="1070" y="216">hủy mỗi SQL quá hạn, kể cả khi</text>
<text class="nl" text-anchor="middle" x="1070" y="232">đang chờ row lock</text>
<text class="nl" text-anchor="middle" x="1070" y="248">pool: DATABASE_POOL_MAX và acquire</text>
<text class="nl" text-anchor="middle" x="1070" y="264">timeout riêng</text>
<text class="nl" text-anchor="middle" x="1070" y="280">migration dùng DataSource riêng, không</text>
<text class="nl" text-anchor="middle" x="1070" y="296">kế thừa timeout này</text>


<rect class="node ops" stroke="var(--muted)" x="40" y="640" width="390" height="130" rx="9"/>
<text class="nt" text-anchor="middle" x="235" y="664">HPA (production)</text>
<text class="nl" text-anchor="middle" x="235" y="682">core-api 3–15 pod · signaling-gateway 3–30 pod</text>
<text class="nl" text-anchor="middle" x="235" y="698">gateway 2.000 socket/process × 30 pod = 60.000</text>
<text class="nl" text-anchor="middle" x="235" y="714">(số học theo mặc định, KHÔNG phải năng lực đo)</text>
<text class="nl" text-anchor="middle" x="235" y="730">cần Custom Metrics adapter nếu scale theo kết nối</text>


<rect class="node ops" stroke="var(--muted)" x="450" y="640" width="390" height="130" rx="9"/>
<text class="nt" text-anchor="middle" x="645" y="664">media-server (production)</text>
<text class="nl" text-anchor="middle" x="645" y="682">2 replica, anti-affinity bắt buộc theo host</text>
<text class="nl" text-anchor="middle" x="645" y="698">PDB ≥ 1 · RollingUpdate maxSurge 0</text>
<text class="nl" text-anchor="middle" x="645" y="714">grace/drain ≤ 18.000 s · không có HPA</text>
<text class="nl" text-anchor="middle" x="645" y="730">một room = một node, không tự chuyển node</text>


<rect class="node ops" stroke="var(--muted)" x="860" y="640" width="380" height="130" rx="9"/>
<text class="nt" text-anchor="middle" x="1050" y="664">Trải pod core-api / gateway</text>
<text class="nl" text-anchor="middle" x="1050" y="682">ưu tiên theo node và zone (ScheduleAnyway)</text>
<text class="nl" text-anchor="middle" x="1050" y="698">không bảo đảm HA nếu cluster chỉ có 1 node/zone</text>
<text class="nl" text-anchor="middle" x="1050" y="714">cần diễn tập mất node/zone trên cluster thật</text>

<rect class="pill" x="226.5" y="164" width="47" height="20" rx="10" stroke="var(--t-service)"/>
<text class="el" text-anchor="middle" x="250" y="178">HTTPS</text>
<rect class="pill" x="855" y="287" width="34" height="20" rx="10" stroke="var(--t-postgres)"/>
<text class="el" text-anchor="middle" x="872" y="301">SQL</text>
<rect class="pill" x="838.5" y="412" width="67" height="20" rx="10" stroke="var(--t-postgres)"/>
<text class="el" text-anchor="middle" x="872" y="426">SELECT 1</text>
<rect x="24" y="828" width="14" height="14" rx="4" fill="none" stroke="var(--t-service)" stroke-width="1.6"/>
<text class="lg" x="44" y="839">core-api (SERVICE)</text>
<rect x="180" y="828" width="14" height="14" rx="4" fill="none" stroke="var(--t-postgres)" stroke-width="1.6"/>
<text class="lg" x="200" y="839">POSTGRES</text>
<rect x="273" y="828" width="14" height="14" rx="4" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="3 2"/>
<text class="lg" x="293" y="839">hạ tầng ngoài code (ghi để đối chiếu)</text>
<rect x="550" y="828" width="14" height="14" rx="4" fill="none" stroke="var(--t-worker)" stroke-width="1.6"/>
<text class="lg" x="570" y="839">job nền (WORKER)</text>
<line x1="694" y1="835" x2="720" y2="835" stroke="var(--muted)" stroke-width="1.6"/><text class="lg" x="726" y="839">gọi đồng bộ</text>
<line x1="814" y1="835" x2="840" y2="835" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="6 4"/><text class="lg" x="846" y="839">bất đồng bộ / best-effort</text>
<rect x="1023" y="827" width="34" height="16" rx="8" fill="var(--bg)" stroke="var(--warn)"/><text class="tag" text-anchor="middle" x="1040" y="838.5" fill="var(--warn)">local</text><text class="lg" x="1063" y="839">code chưa commit</text>
</svg>