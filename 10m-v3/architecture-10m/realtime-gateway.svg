<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 900" width="1280" height="900" role="img" aria-label="Realtime gateway: admission, quota, fanout, ngân sách gửi" font-family="-apple-system,Segoe UI,Noto Sans,Helvetica,Arial,sans-serif">
<title>Realtime gateway: admission, quota, fanout, ngân sách gửi</title>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--border:#d1d9e0;--subtle:#f6f8fa;--accent:#0969da;--ok:#1a7f37;--warn:#bc4c00;
--t-controller:#1a7f37;--t-service:#bc4c00;--t-worker:#8250df;--t-postgres:#0969da;--t-redis:#cf222e;--t-kafka:#57606a;--t-external:#0a7a6b;--t-gateway:#9a6700}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#8b949e;--border:#30363d;--subtle:#161b22;--accent:#4493f8;--ok:#56d364;--warn:#ffa657;
--t-controller:#56d364;--t-service:#ffa657;--t-worker:#d2a8ff;--t-postgres:#58a6ff;--t-redis:#ff7b72;--t-kafka:#c9d1d9;--t-external:#39d0bb;--t-gateway:#e3b341}}
.bg{fill:var(--bg)}
.ttl{font:700 17px -apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--fg)}
.sub{font:12px -apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--muted)}
.nt{font:700 13px -apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--fg)}
.nl{font:11.5px -apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--muted)}
.gt{font:600 12px -apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--muted)}
.el{font:600 11px -apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--fg)}
.lg{font:11.5px -apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--muted)}
.node{fill:var(--subtle);stroke-width:1.6}
.node.ops{stroke-dasharray:5 4}
.grp{fill:none;stroke:var(--border);stroke-width:1.2;stroke-dasharray:6 4}
.edge{fill:none;stroke-width:1.6;stroke-linejoin:round}
.edge.async{stroke-dasharray:6 4}
.pill{fill:var(--bg);stroke-width:1}
.tag{font:700 10px -apple-system,"Segoe UI",sans-serif}
.tagbg{stroke-width:1}
a:hover .nt{text-decoration:underline}</style>
<defs>
<marker id="ah-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>
<marker id="ah-gateway" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t-gateway)"/></marker>
<marker id="ah-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t-service)"/></marker>
<marker id="ah-worker" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t-worker)"/></marker>
<marker id="ah-postgres" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t-postgres)"/></marker>
<marker id="ah-redis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t-redis)"/></marker>
<marker id="ah-kafka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t-kafka)"/></marker>
<marker id="ah-external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t-external)"/></marker>
<marker id="ah-ops" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1280" height="900"/>
<text class="ttl" x="24" y="30">Realtime gateway: admission, quota, fanout, ngân sách gửi</text>
<text class="sub" x="24" y="50">Mỗi socket qua 4 cửa trước khi connect; mỗi pod giữ bộ nhớ có trần. Số trên sơ đồ là mặc định cấu hình, chưa phải năng lực đã đo.</text>
<rect class="grp" x="320" y="96" width="440" height="760" rx="12"/>
<text class="gt" x="334" y="116">signaling-gateway (một pod)</text>
<path class="edge" d="M240,166 L350,166" stroke="var(--t-gateway)" marker-end="url(#ah-gateway)"/>
<path class="edge" d="M540,202 L540,226" stroke="var(--t-gateway)" marker-end="url(#ah-gateway)"/>
<path class="edge" d="M540,282 L540,306" stroke="var(--t-gateway)" marker-end="url(#ah-gateway)"/>
<path class="edge" d="M540,378 L540,402" stroke="var(--t-gateway)" marker-end="url(#ah-gateway)"/>
<path class="edge" d="M730,342 L736,342 Q742,342 742,336 L742,333 Q742,325 750,325 L900,325" stroke="var(--t-redis)" marker-end="url(#ah-redis)"/>
<path class="edge" d="M730,438 L742,438 Q750,438 750,430 L750,383 Q750,375 758,375 L900,375" stroke="var(--t-redis)" marker-end="url(#ah-redis)"/>
<path class="edge" d="M730,542 L750,542 Q758,542 758,534 L758,433 Q758,425 766,425 L900,425" stroke="var(--t-redis)" marker-end="url(#ah-redis)"/>
<path class="edge async" d="M900,505 L858,505 Q850,505 850,513 L850,646 Q850,654 842,654 L730,654" stroke="var(--t-redis)" marker-end="url(#ah-redis)"/>
<path class="edge async" d="M1050,192 L1050,290" stroke="var(--t-redis)" marker-end="url(#ah-redis)"/>
<path class="edge" d="M730,766 L809.5,766 Q815,766 815,760.5 L815,760.5 Q815,755 820.5,755 L900,755" stroke="var(--t-redis)" marker-end="url(#ah-redis)" marker-start="url(#ah-redis)"/>
<path class="edge async" d="M350,654 L298,654 Q290,654 290,646 L290,242 Q290,234 282,234 L240,234" stroke="var(--t-gateway)" marker-end="url(#ah-gateway)"/>

<rect class="node" stroke="var(--muted)" x="40" y="130" width="200" height="140" rx="9"/>
<text class="nt" text-anchor="middle" x="140" y="154">Client Web</text>
<text class="nl" text-anchor="middle" x="140" y="172">Socket.IO, JWT trong handshake</text>
<text class="nl" text-anchor="middle" x="140" y="188">qua ingress/LB (giới hạn kết nối</text>
<text class="nl" text-anchor="middle" x="140" y="204">và rate nằm ngoài code)</text>
<text class="nl" text-anchor="middle" x="140" y="220">mất kết nối → thử lại + REST</text>


<rect class="node" stroke="var(--muted)" x="40" y="330" width="200" height="100" rx="9"/>
<text class="nt" text-anchor="middle" x="140" y="354">Chính sách thử lại</text>
<text class="nl" text-anchor="middle" x="140" y="372">tối đa 25 lần, equal jitter</text>
<text class="nl" text-anchor="middle" x="140" y="388">mỗi lần ≤ 30 s: tổng ≥ 315,5 s</text>
<text class="nl" text-anchor="middle" x="140" y="404">&gt; lease tối đa 300 s</text>

<rect class="tagbg" x="192" y="322" width="42" height="16" rx="8" fill="var(--bg)" stroke="var(--warn)"/>
<text class="tag" text-anchor="middle" x="213" y="333.5" fill="var(--warn)">local</text>
<a href="../code-10m/30-realtime-gateway/01-ws-handshake-admit.html">
<rect class="node" stroke="var(--t-gateway)" x="350" y="130" width="380" height="72" rx="9"/>
<text class="nt" text-anchor="middle" x="540" y="154">1 · Admission</text>
<text class="nl" text-anchor="middle" x="540" y="172">2.000 socket + 64 handshake đồng thời / process</text>
<text class="nl" text-anchor="middle" x="540" y="188">không hàng chờ: hết chỗ → lỗi có thể thử lại</text>
</a>
<rect class="tagbg" x="682" y="122" width="42" height="16" rx="8" fill="var(--bg)" stroke="var(--warn)"/>
<text class="tag" text-anchor="middle" x="703" y="133.5" fill="var(--warn)">local</text>
<a href="../code-10m/30-realtime-gateway/01-ws-handshake-admit.html">
<rect class="node" stroke="var(--t-gateway)" x="350" y="226" width="380" height="56" rx="9"/>
<text class="nt" text-anchor="middle" x="540" y="250">2 · Xác thực JWT</text>
<text class="nl" text-anchor="middle" x="540" y="268">xoay khoá; sai/thiếu → từ chối (fail closed)</text>
</a>
<a href="../code-10m/30-realtime-gateway/01-ws-handshake-admit.html">
<rect class="node" stroke="var(--t-gateway)" x="350" y="306" width="380" height="72" rx="9"/>
<text class="nt" text-anchor="middle" x="540" y="330">3 · Lease slot theo user</text>
<text class="nl" text-anchor="middle" x="540" y="348">Lua nguyên tử, tối đa N socket/user</text>
<text class="nl" text-anchor="middle" x="540" y="364">shard Redis chọn bằng hash(userId)</text>
</a>
<a href="../code-10m/30-realtime-gateway/01-ws-handshake-admit.html">
<rect class="node" stroke="var(--t-gateway)" x="350" y="402" width="380" height="72" rx="9"/>
<text class="nt" text-anchor="middle" x="540" y="426">4 · SUBSCRIBE kênh của user</text>
<text class="nl" text-anchor="middle" x="540" y="444">xong trước khi handshake kết thúc</text>
<text class="nl" text-anchor="middle" x="540" y="460">pod chỉ nghe user đang có socket trên pod</text>
</a>
<a href="../code-10m/30-realtime-gateway/02-job-lease-refresh-tick.html">
<rect class="node" stroke="var(--t-gateway)" x="350" y="506" width="380" height="72" rx="9"/>
<text class="nt" text-anchor="middle" x="540" y="530">Gia hạn lease theo lô</text>
<text class="nl" text-anchor="middle" x="540" y="548">một timer/pod, pipeline theo shard</text>
<text class="nl" text-anchor="middle" x="540" y="564">Redis mất lease → cấp lại trước khi ngắt</text>
</a>
<a href="../code-10m/30-realtime-gateway/03-ws-relay-outbound-budget.html">
<rect class="node" stroke="var(--t-gateway)" x="350" y="610" width="380" height="88" rx="9"/>
<text class="nt" text-anchor="middle" x="540" y="634">Relay + ngân sách gửi</text>
<text class="nl" text-anchor="middle" x="540" y="652">chỉ emit cho socket cục bộ của user</text>
<text class="nl" text-anchor="middle" x="540" y="668">128 gói / 1 MiB mỗi socket · 16.384 gói / 128 MiB mỗi pod</text>
<text class="nl" text-anchor="middle" x="540" y="684">quá ngân sách: đóng transport socket chậm</text>
</a>
<rect class="tagbg" x="682" y="602" width="42" height="16" rx="8" fill="var(--bg)" stroke="var(--warn)"/>
<text class="tag" text-anchor="middle" x="703" y="613.5" fill="var(--warn)">local</text>
<a href="../code-10m/30-realtime-gateway/04-boot-quota-topology-guard.html">
<rect class="node" stroke="var(--t-gateway)" x="350" y="730" width="380" height="72" rx="9"/>
<text class="nt" text-anchor="middle" x="540" y="754">Khởi động: guard topology quota</text>
<text class="nl" text-anchor="middle" x="540" y="772">fingerprint danh sách shard có thứ tự</text>
<text class="nl" text-anchor="middle" x="540" y="788">khác fingerprint đã đăng ký → không khởi động</text>
</a>
<rect class="tagbg" x="682" y="722" width="42" height="16" rx="8" fill="var(--bg)" stroke="var(--warn)"/>
<text class="tag" text-anchor="middle" x="703" y="733.5" fill="var(--warn)">local</text>

<rect class="node" stroke="var(--t-service)" x="900" y="120" width="300" height="72" rx="9"/>
<text class="nt" text-anchor="middle" x="1050" y="144">core-api</text>
<text class="nl" text-anchor="middle" x="1050" y="162">publish SAU khi commit bền vững</text>
<text class="nl" text-anchor="middle" x="1050" y="178">cùng hàm hash shard theo userId</text>


<path class="node" stroke="var(--t-redis)" d="M900,298 a150,8 0 0 1 300,0 v234 a150,8 0 0 1 -300,0 z"/>
<path class="node" stroke="var(--t-redis)" fill="none" d="M900,298 a150,8 0 0 0 300,0"/>
<text class="nt" text-anchor="middle" x="1050" y="322">Redis realtime shards</text>
<text class="nl" text-anchor="middle" x="1050" y="340">REALTIME_REDIS_URLS, tối đa 64 shard</text>
<text class="nl" text-anchor="middle" x="1050" y="356">chọn shard: FNV-1a(userId)</text>
<text class="nl" text-anchor="middle" x="1050" y="372">lease + presence (sorted set)</text>
<text class="nl" text-anchor="middle" x="1050" y="388">pub/sub realtime:user:{userId}</text>
<text class="nl" text-anchor="middle" x="1050" y="404">at-most-once, không giữ lịch sử</text>


<path class="node" stroke="var(--t-redis)" d="M900,698 a150,8 0 0 1 300,0 v114 a150,8 0 0 1 -300,0 z"/>
<path class="node" stroke="var(--t-redis)" fill="none" d="M900,698 a150,8 0 0 0 300,0"/>
<text class="nt" text-anchor="middle" x="1050" y="722">Redis điều phối (REDIS_URL)</text>
<text class="nl" text-anchor="middle" x="1050" y="740">Socket.IO cluster adapter</text>
<text class="nl" text-anchor="middle" x="1050" y="756">key bền vững: fingerprint topology</text>
<text class="nl" text-anchor="middle" x="1050" y="772">là phụ thuộc HA chung của mọi gateway</text>

<rect class="pill" x="258" y="156" width="74" height="20" rx="10" stroke="var(--t-gateway)"/>
<text class="el" text-anchor="middle" x="295" y="170">WebSocket</text>
<rect class="pill" x="771.5" y="315" width="113" height="20" rx="10" stroke="var(--t-redis)"/>
<text class="el" text-anchor="middle" x="828" y="329">EVALSHA acquire</text>
<rect class="pill" x="791" y="365" width="74" height="20" rx="10" stroke="var(--t-redis)"/>
<text class="el" text-anchor="middle" x="828" y="379">SUBSCRIBE</text>
<rect class="pill" x="768" y="415" width="120" height="20" rx="10" stroke="var(--t-redis)"/>
<text class="el" text-anchor="middle" x="828" y="429">pipeline EVALSHA</text>
<rect class="pill" x="759.5" y="644" width="61" height="20" rx="10" stroke="var(--t-redis)"/>
<text class="el" text-anchor="middle" x="790" y="658">message</text>
<rect class="pill" x="1019.5" y="231" width="61" height="20" rx="10" stroke="var(--t-redis)"/>
<text class="el" text-anchor="middle" x="1050" y="245">PUBLISH</text>
<rect class="pill" x="722" y="750.5" width="186" height="20" rx="10" stroke="var(--t-redis)"/>
<text class="el" text-anchor="middle" x="815" y="764.5">EVAL fingerprint + adapter</text>
<rect class="pill" x="269.5" y="440" width="41" height="20" rx="10" stroke="var(--t-gateway)"/>
<text class="el" text-anchor="middle" x="290" y="454">emit</text>
<rect x="24" y="868" width="14" height="14" rx="4" fill="none" stroke="var(--t-gateway)" stroke-width="1.6"/>
<text class="lg" x="44" y="879">GATEWAY</text>
<rect x="111" y="868" width="14" height="14" rx="4" fill="none" stroke="var(--t-redis)" stroke-width="1.6"/>
<text class="lg" x="131" y="879">REDIS</text>
<rect x="185" y="868" width="14" height="14" rx="4" fill="none" stroke="var(--t-service)" stroke-width="1.6"/>
<text class="lg" x="205" y="879">core-api (SERVICE)</text>
<line x1="341" y1="875" x2="367" y2="875" stroke="var(--muted)" stroke-width="1.6"/><text class="lg" x="373" y="879">gọi đồng bộ</text>
<line x1="461" y1="875" x2="487" y2="875" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="6 4"/><text class="lg" x="493" y="879">bất đồng bộ / best-effort</text>
<rect x="670" y="867" width="34" height="16" rx="8" fill="var(--bg)" stroke="var(--warn)"/><text class="tag" text-anchor="middle" x="687" y="878.5" fill="var(--warn)">local</text><text class="lg" x="710" y="879">code chưa commit</text>
</svg>