<rect class="node" stroke="var(--t-external)" x="40" y="100" width="200" height="92" rx="9"/>
<text class="nt" text-anchor="middle" x="140" y="124">LiveKit webhook</text>
<text class="nl" text-anchor="middle" x="140" y="142">joined / left</text>
<text class="nl" text-anchor="middle" x="140" y="158">có thể trùng, đảo thứ tự, mất</text>


<rect class="node" stroke="var(--muted)" x="280" y="100" width="200" height="92" rx="9"/>
<text class="nt" text-anchor="middle" x="380" y="124">Client Web</text>
<text class="nl" text-anchor="middle" x="380" y="142">GET /calling/calls/:id (poll)</text>
<text class="nl" text-anchor="middle" x="380" y="158">POST join / end</text>


<rect class="node" stroke="var(--t-external)" x="545" y="112" width="190" height="84" rx="9"/>
<text class="nt" text-anchor="middle" x="640" y="136">LiveKit node A</text>
<text class="nl" text-anchor="middle" x="640" y="154">một room nằm trên một node</text>
<text class="nl" text-anchor="middle" x="640" y="170">node chết: room không tự chuyển</text>


<rect class="node" stroke="var(--t-external)" x="760" y="112" width="190" height="84" rx="9"/>
<text class="nt" text-anchor="middle" x="855" y="136">LiveKit node B</text>
<text class="nl" text-anchor="middle" x="855" y="154">PDB ≥ 1 pod · drain ≤ 18.000 s</text>
<text class="nl" text-anchor="middle" x="855" y="170">không HPA cho media</text>


<path class="node" stroke="var(--t-redis)" d="M975,114 a120,8 0 0 1 240,0 v80 a120,8 0 0 1 -240,0 z"/>
<path class="node" stroke="var(--t-redis)" fill="none" d="M975,114 a120,8 0 0 0 240,0"/>
<text class="nt" text-anchor="middle" x="1095" y="138">Redis LiveKit (dùng chung)</text>
<text class="nl" text-anchor="middle" x="1095" y="156">hai node cùng Redis, cùng credential</text>

<a href="../code-10m/36-calling-recovery/04-post-livekit-webhook.html">
<rect class="node" stroke="var(--t-service)" x="40" y="290" width="200" height="124" rx="9"/>
<text class="nt" text-anchor="middle" x="140" y="314">Webhook joined/left</text>
<text class="nl" text-anchor="middle" x="140" y="332">idempotent: joined = set-if-null</text>
<text class="nl" text-anchor="middle" x="140" y="348">rời → MỞ reconnect grace,</text>
<text class="nl" text-anchor="middle" x="140" y="364">không end ngay</text>
</a>
<rect class="tagbg" x="192" y="282" width="42" height="16" rx="8" fill="var(--bg)" stroke="var(--warn)"/>
<text class="tag" text-anchor="middle" x="213" y="293.5" fill="var(--warn)">local</text>
<a href="../code-10m/36-calling-recovery/03-get-call-state.html">
<rect class="node" stroke="var(--t-service)" x="280" y="290" width="200" height="124" rx="9"/>
<text class="nt" text-anchor="middle" x="380" y="314">GET /calls/:id</text>
<text class="nl" text-anchor="middle" x="380" y="332">đối soát SFU: snapshot đọc</text>
<text class="nl" text-anchor="middle" x="380" y="348">NGOÀI khoá, kiểm lại dưới</text>
<text class="nl" text-anchor="middle" x="380" y="364">row lock; giữ nguyên grace</text>
</a>
<rect class="tagbg" x="432" y="282" width="42" height="16" rx="8" fill="var(--bg)" stroke="var(--warn)"/>
<text class="tag" text-anchor="middle" x="453" y="293.5" fill="var(--warn)">local</text>
<a href="../code-10m/36-calling-recovery/01-job-call-timer-tick.html">
<rect class="node" stroke="var(--t-worker)" x="520" y="290" width="330" height="124" rx="9"/>
<text class="nt" text-anchor="middle" x="685" y="314">Timer tick (mọi pod)</text>
<text class="nl" text-anchor="middle" x="685" y="332">claim ≤ 100 call/nhóm: UPDATE … SKIP LOCKED</text>
<text class="nl" text-anchor="middle" x="685" y="348">lease theo đồng hồ DB (CALLING_JOB_LEASE_MS)</text>
<text class="nl" text-anchor="middle" x="685" y="364">ngân sách 1 s, luân phiên pending/reconnect/free</text>
<text class="nl" text-anchor="middle" x="685" y="380">terminal hoá, để marker cleanup, không chờ SFU</text>
</a>
<rect class="tagbg" x="802" y="282" width="42" height="16" rx="8" fill="var(--bg)" stroke="var(--warn)"/>
<text class="tag" text-anchor="middle" x="823" y="293.5" fill="var(--warn)">local</text>
<a href="../code-10m/36-calling-recovery/02-job-call-cleanup-tick.html">
<rect class="node" stroke="var(--t-worker)" x="910" y="290" width="330" height="124" rx="9"/>
<text class="nt" text-anchor="middle" x="1075" y="314">Cleanup tick (mọi pod)</text>
<text class="nl" text-anchor="middle" x="1075" y="332">claim call có cleanup_pending bằng lease riêng</text>
<text class="nl" text-anchor="middle" x="1075" y="348">≤ 2 tác vụ đồng thời (và ≤ ⌊pool/4⌋)</text>
<text class="nl" text-anchor="middle" x="1075" y="364">deleteRoom: not-found coi là đã xong</text>
<text class="nl" text-anchor="middle" x="1075" y="380">lỗi: giữ marker, nghỉ 2,5–5 s rồi thử lại</text>
</a>
<rect class="tagbg" x="1192" y="282" width="42" height="16" rx="8" fill="var(--bg)" stroke="var(--warn)"/>
<text class="tag" text-anchor="middle" x="1213" y="293.5" fill="var(--warn)">local</text>
<a href="../code-10m/32-data-lifecycle/01-job-retention-tick.html">
<rect class="node" stroke="var(--t-worker)" x="520" y="470" width="720" height="64" rx="9"/>
<text class="nt" text-anchor="middle" x="880" y="494">Admission FIFO theo DataSource (ManagedInterval)</text>
<text class="nl" text-anchor="middle" x="880" y="512">làn critical 1 slot cho timer · làn thường cho cleanup và job khác · người chờ không giữ kết nối</text>
</a>
<rect class="tagbg" x="1192" y="462" width="42" height="16" rx="8" fill="var(--bg)" stroke="var(--warn)"/>
<text class="tag" text-anchor="middle" x="1213" y="473.5" fill="var(--warn)">local</text>

<path class="node" stroke="var(--t-postgres)" d="M40,618 a600,8 0 0 1 1200,0 v134 a600,8 0 0 1 -1200,0 z"/>
<path class="node" stroke="var(--t-postgres)" fill="none" d="M40,618 a600,8 0 0 0 1200,0"/>
<text class="nt" text-anchor="middle" x="640" y="642">PostgreSQL: call_sessions</text>
<text class="nl" text-anchor="middle" x="640" y="660">status · reconnect_started_at (đặt một lần, poll lặp lại không gia hạn) · cleanup_pending</text>
<text class="nl" text-anchor="middle" x="640" y="676">timer_claim_until · cleanup_claim_until: lease theo đồng hồ DB, nhả bằng so sánh đúng timestamp đã claim</text>
<text class="nl" text-anchor="middle" x="640" y="692">index một phần (started_at, id) cho free-limit · (reconnect_started_at, id) cho reconnect</text>
<text class="nl" text-anchor="middle" x="640" y="708">call đã ended là terminal; end lặp, webhook và timer đua nhau đều an toàn nhờ FOR UPDATE</text>

