<rect class="bg" x="0" y="0" width="1280" height="820"/>
<text class="ttl" x="24" y="30">Calling: worker có lease, reconnect grace, cleanup bền vững</text>
<text class="sub" x="24" y="50">Nhiều pod cùng chạy timer và cleanup; mỗi pod claim các lô rời nhau bằng UPDATE … SKIP LOCKED, trạng thái đúng vẫn do row lock quyết định.</text>
<rect class="grp" x="520" y="70" width="720" height="150" rx="12"/>
<text class="gt" x="534" y="90">media-server (production: 2 replica trên 2 host khác nhau)</text>
