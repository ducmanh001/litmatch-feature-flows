<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 780" width="1280" height="780" role="img" aria-label="Matching: hàng đợi Redis chia shard, matcher, repair, speed-up" font-family="-apple-system,Segoe UI,Noto Sans,Helvetica,Arial,sans-serif">
<title>Matching: hàng đợi Redis chia shard, matcher, repair, speed-up</title>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--border:#d1d9e0;--subtle:#f6f8fa;--accent:#0969da;--ok:#1a7f37;--warn:#bc4c00;
--t-controller:#1a7f37;--t-service:#bc4c00;--t-worker:#8250df;--t-postgres:#0969da;--t-redis:#cf222e;--t-kafka:#57606a;--t-external:#0a7a6b;--t-gateway:#9a6700}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#8b949e;--border:#30363d;--subtle:#161b22;--accent:#4493f8;--ok:#56d364;--warn:#ffa657;
--t-controller:#56d364;--t-service:#ffa657;--t-worker:#d2a8ff;--t-postgres:#58a6ff;--t-redis:#ff7b72;--t-kafka:#c9d1d9;--t-external:#39d0bb;--t-gateway:#e3b341}}
.bg{fill:var(--bg)}
.ttl{font:700 17px -apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--fg)}
.sub{font:12px -apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--muted)}
.nt{font:700 13px -apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--fg)}
.nl{font:11.5px -apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--muted)}
.gt{font:600 12px -apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--muted)}
.el{font:600 11px -apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--fg)}
.lg{font:11.5px -apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--muted)}
.node{fill:var(--subtle);stroke-width:1.6}
.node.ops{stroke-dasharray:5 4}
.grp{fill:none;stroke:var(--border);stroke-width:1.2;stroke-dasharray:6 4}
.edge{fill:none;stroke-width:1.6;stroke-linejoin:round}
.edge.async{stroke-dasharray:6 4}
.pill{fill:var(--bg);stroke-width:1}
.tag{font:700 10px -apple-system,"Segoe UI",sans-serif}
.tagbg{stroke-width:1}
a:hover .nt{text-decoration:underline}</style>
<defs>
<marker id="ah-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>
<marker id="ah-gateway" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t-gateway)"/></marker>
<marker id="ah-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t-service)"/></marker>
<marker id="ah-worker" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t-worker)"/></marker>
<marker id="ah-postgres" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t-postgres)"/></marker>
<marker id="ah-redis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t-redis)"/></marker>
<marker id="ah-kafka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t-kafka)"/></marker>
<marker id="ah-external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t-external)"/></marker>
<marker id="ah-ops" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1280" height="780"/>
<text class="ttl" x="24" y="30">Matching: hàng đợi Redis chia shard, matcher, repair, speed-up</text>
<text class="sub" x="24" y="50">Postgres là nguồn sự thật; Redis chỉ là bản chiếu dẫn xuất của hàng đợi, mất thì dựng lại từ DB mà không cần client gửi lại.</text>
<path class="edge" d="M640,262 L640,216" stroke="var(--t-redis)" marker-end="url(#ah-redis)"/>
<path class="edge async" d="M140,410 L140,338" stroke="var(--t-redis)" marker-end="url(#ah-redis)"/>
<path class="edge" d="M390,410 L390,338" stroke="var(--t-redis)" marker-end="url(#ah-redis)"/>
<path class="edge" d="M640,410 L640,338" stroke="var(--t-redis)" marker-end="url(#ah-redis)"/>
<path class="edge" d="M890,410 L890,338" stroke="var(--t-redis)" marker-end="url(#ah-redis)"/>
<path class="edge async" d="M790,466 L740,466" stroke="var(--t-worker)" marker-end="url(#ah-worker)"/>
<path class="edge" d="M140,522 L140,640" stroke="var(--t-postgres)" marker-end="url(#ah-postgres)"/>
<path class="edge" d="M390,522 L390,640" stroke="var(--t-postgres)" marker-end="url(#ah-postgres)"/>
<path class="edge" d="M640,522 L640,640" stroke="var(--t-postgres)" marker-end="url(#ah-postgres)"/>
<path class="edge" d="M890,522 L890,640" stroke="var(--t-postgres)" marker-end="url(#ah-postgres)"/>
<path class="edge" d="M1140,522 L1140,640" stroke="var(--t-postgres)" marker-end="url(#ah-postgres)"/>

<path class="node" stroke="var(--t-redis)" d="M300,92 a340,8 0 0 1 680,0 v116 a340,8 0 0 1 -680,0 z"/>
<path class="node" stroke="var(--t-redis)" fill="none" d="M300,92 a340,8 0 0 0 680,0"/>
<text class="nt" text-anchor="middle" x="640" y="116">Redis matching (một hoặc nhiều instance)</text>
<text class="nl" text-anchor="middle" x="640" y="134">MATCHING_REDIS_URLS: danh sách có thứ tự, mọi pod phải cùng danh sách</text>
<text class="nl" text-anchor="middle" x="640" y="150">sorted set mỗi hàng đợi logic: matching:queue:{loại}:{vùng}:{nhóm tuổi}</text>
<text class="nl" text-anchor="middle" x="640" y="166">score = enqueuedAt + trustPenalty − boost (nhỏ ghép trước)</text>
<text class="nl" text-anchor="middle" x="640" y="182">script Lua claimPair lấy cả hai vé nguyên tử · matching:active-shards</text>

<a href="../code-10m/31-matching-engine/03-queue-sharded-routing.html">
<rect class="node" stroke="var(--t-redis)" x="40" y="262" width="1200" height="76" rx="9"/>
<text class="nt" text-anchor="middle" x="640" y="286">Lớp hàng đợi: ShardedMatchingQueue (nhiều Redis) hoặc RedisMatchingQueue (một Redis)</text>
<text class="nl" text-anchor="middle" x="640" y="304">hash(tên hàng đợi) chọn đúng MỘT Redis nên claim hai vé vẫn nguyên tử; mọi pod chọn cùng Redis nếu cùng danh sách có thứ tự</text>
<text class="nl" text-anchor="middle" x="640" y="320">listActiveShards gộp các Redis còn khoẻ, bỏ mục active lỗi thời sau khi đổi topology; một Redis lỗi không chặn các Redis khác</text>
</a>
<rect class="tagbg" x="1192" y="254" width="42" height="16" rx="8" fill="var(--bg)" stroke="var(--warn)"/>
<text class="tag" text-anchor="middle" x="1213" y="265.5" fill="var(--warn)">local</text>

<rect class="node" stroke="var(--t-service)" x="40" y="410" width="200" height="112" rx="9"/>
<text class="nt" text-anchor="middle" x="140" y="434">Vào hàng đợi</text>
<text class="nl" text-anchor="middle" x="140" y="452">POST /matching/tickets</text>
<text class="nl" text-anchor="middle" x="140" y="468">ghi match_tickets, SAU commit</text>
<text class="nl" text-anchor="middle" x="140" y="484">mới ZADD NX vào Redis</text>

<a href="../code-10m/10-matching-speed-up-detail/01-post-speedup-ticket.html">
<rect class="node" stroke="var(--t-service)" x="290" y="410" width="200" height="112" rx="9"/>
<text class="nt" text-anchor="middle" x="390" y="434">Speed-up</text>
<text class="nl" text-anchor="middle" x="390" y="452">POST …/tickets/:id/speedup</text>
<text class="nl" text-anchor="middle" x="390" y="468">trừ Diamond → cộng boost DB</text>
<text class="nl" text-anchor="middle" x="390" y="484">→ ZADD XX LT hạ score</text>
</a>
<a href="../code-10m/31-matching-engine/01-job-matcher-tick.html">
<rect class="node" stroke="var(--t-worker)" x="540" y="410" width="200" height="112" rx="9"/>
<text class="nt" text-anchor="middle" x="640" y="434">Matcher (mỗi pod)</text>
<text class="nl" text-anchor="middle" x="640" y="452">wake-up khi có vé + backstop</text>
<text class="nl" text-anchor="middle" x="640" y="468">cửa sổ 32 vé → chọn cặp → claim</text>
<text class="nl" text-anchor="middle" x="640" y="484">khoá 2 vé theo id, kiểm lại</text>
</a>
<a href="../code-10m/31-matching-engine/02-job-matching-queue-repair.html">
<rect class="node" stroke="var(--t-worker)" x="790" y="410" width="200" height="112" rx="9"/>
<text class="nt" text-anchor="middle" x="890" y="434">Queue repair (singleton)</text>
<text class="nl" text-anchor="middle" x="890" y="452">mỗi 5 s ≤ 500 vé theo cursor</text>
<text class="nl" text-anchor="middle" x="890" y="468">NX khôi phục · XX LT refresh</text>
<text class="nl" text-anchor="middle" x="890" y="484">rồi đánh thức matcher</text>
</a>
<rect class="tagbg" x="942" y="402" width="42" height="16" rx="8" fill="var(--bg)" stroke="var(--warn)"/>
<text class="tag" text-anchor="middle" x="963" y="413.5" fill="var(--warn)">local</text>

<rect class="node" stroke="var(--t-worker)" x="1040" y="410" width="200" height="112" rx="9"/>
<text class="nt" text-anchor="middle" x="1140" y="434">Ticket sweeper (singleton)</text>
<text class="nl" text-anchor="middle" x="1140" y="452">expire vé quá hạn chờ</text>
<text class="nl" text-anchor="middle" x="1140" y="468">thêm vé requeue mới bằng NX</text>


<path class="node" stroke="var(--t-postgres)" d="M40,648 a600,8 0 0 1 1200,0 v84 a600,8 0 0 1 -1200,0 z"/>
<path class="node" stroke="var(--t-postgres)" fill="none" d="M40,648 a600,8 0 0 0 1200,0"/>
<text class="nt" text-anchor="middle" x="640" y="672">PostgreSQL (nguồn sự thật)</text>
<text class="nl" text-anchor="middle" x="640" y="690">match_tickets · match_sessions · notifications</text>
<text class="nl" text-anchor="middle" x="640" y="706">runtime_job_checkpoints: cursor của repair (metadata dùng-được-bỏ)</text>

<rect class="pill" x="537" y="229" width="206" height="20" rx="10" stroke="var(--t-redis)"/>
<text class="el" text-anchor="middle" x="640" y="243">ZADD · ZRANGE · Lua claimPair</text>
<rect class="pill" x="67" y="364" width="146" height="20" rx="10" stroke="var(--t-redis)"/>
<text class="el" text-anchor="middle" x="140" y="378">ZADD NX (sau commit)</text>
<rect class="pill" x="350" y="364" width="80" height="20" rx="10" stroke="var(--t-redis)"/>
<text class="el" text-anchor="middle" x="390" y="378">ZADD XX LT</text>
<rect class="pill" x="560" y="364" width="160" height="20" rx="10" stroke="var(--t-redis)"/>
<text class="el" text-anchor="middle" x="640" y="378">peekWindow · claimPair</text>
<rect class="pill" x="850" y="364" width="80" height="20" rx="10" stroke="var(--t-redis)"/>
<text class="el" text-anchor="middle" x="890" y="378">NX + XX LT</text>
<rect class="pill" x="60" y="571" width="160" height="20" rx="10" stroke="var(--t-postgres)"/>
<text class="el" text-anchor="middle" x="140" y="585">INSERT vé (idempotent)</text>
<rect class="pill" x="336.5" y="571" width="107" height="20" rx="10" stroke="var(--t-postgres)"/>
<text class="el" text-anchor="middle" x="390" y="585">boost cộng dồn</text>
<rect class="pill" x="557" y="571" width="166" height="20" rx="10" stroke="var(--t-postgres)"/>
<text class="el" text-anchor="middle" x="640" y="585">tx: khoá 2 vé → session</text>
<rect class="pill" x="820" y="571" width="140" height="20" rx="10" stroke="var(--t-postgres)"/>
<text class="el" text-anchor="middle" x="890" y="585">keyset + ghi cursor</text>
<rect class="pill" x="1086.5" y="571" width="107" height="20" rx="10" stroke="var(--t-postgres)"/>
<text class="el" text-anchor="middle" x="1140" y="585">expire quá hạn</text>
<rect x="24" y="748" width="14" height="14" rx="4" fill="none" stroke="var(--t-redis)" stroke-width="1.6"/>
<text class="lg" x="44" y="759">REDIS</text>
<rect x="98" y="748" width="14" height="14" rx="4" fill="none" stroke="var(--t-worker)" stroke-width="1.6"/>
<text class="lg" x="118" y="759">job nền (WORKER)</text>
<rect x="242" y="748" width="14" height="14" rx="4" fill="none" stroke="var(--t-postgres)" stroke-width="1.6"/>
<text class="lg" x="262" y="759">POSTGRES</text>
<rect x="335" y="748" width="14" height="14" rx="4" fill="none" stroke="var(--t-service)" stroke-width="1.6"/>
<text class="lg" x="355" y="759">core-api (SERVICE)</text>
<line x1="491" y1="755" x2="517" y2="755" stroke="var(--muted)" stroke-width="1.6"/><text class="lg" x="523" y="759">gọi đồng bộ</text>
<line x1="611" y1="755" x2="637" y2="755" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="6 4"/><text class="lg" x="643" y="759">bất đồng bộ / best-effort</text>
<rect x="820" y="747" width="34" height="16" rx="8" fill="var(--bg)" stroke="var(--warn)"/><text class="tag" text-anchor="middle" x="837" y="758.5" fill="var(--warn)">local</text><text class="lg" x="860" y="759">code chưa commit</text>
</svg>