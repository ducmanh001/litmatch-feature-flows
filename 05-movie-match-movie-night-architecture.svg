t x="1311" y="380" width="300" height="92" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1461" y="432.8">YouTube</tspan></text></g><line x1="28" x2="2020" y1="706" y2="706" stroke="#343a40" stroke-width="1"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="748">Điểm quan trọng</tspan></text><g data-note="important"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="780">core-api giữ playback state trong PostgreSQL và fanout qua Gateway. Friend mode dùng Conversation có sẵn; anonymous mode có queue, chat và rating riêng nhưng vẫn là cùng module MovieMatch.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="830">Lưu ý</tspan></text><g data-note="caution"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="862">Không có LiveKit, proxy hay transcode video trong flow này. Queue anonymous dùng advisory transaction lock PostgreSQL; Redis chỉ vận chuyển event. URL friend mode phải qua hostname allowlist.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="400" text-anchor="start" fill="#68a9e0"><tspan x="28" y="914">Nguồn: docs/services/movie-match-service.md · docs/services/friend-service.md · apps/core-api/src/modules/movie-match/movie-match.module.ts · Chi tiết: render-verification.json</tspan></text></svg>