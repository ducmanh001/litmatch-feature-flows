ata-w="328" data-h="152"><rect x="577" y="56" width="328" height="152" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="22" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="741" y="139.48">core-api</tspan></text></g><g data-component="postgres" data-container="PostgreSQL" data-x="1311" data-y="64" data-w="154" data-h="100"><path d="M 1311 79 V 149 C 1311 169 1465 169 1465 149 V 79 Z" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><ellipse cx="1388" cy="79" rx="77" ry="15" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="18" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1388" y="127">PostgreSQL</tspan></text></g><g data-component="redis" data-container="Redis" data-x="1355" data-y="232" data-w="134" data-h="100"><path d="M 1355 247 V 317 C 1355 337 1489 337 1489 317 V 247 Z" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><ellipse cx="1422" cy="247" rx="67" ry="15" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="18" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1422" y="295">Redis</tspan></text></g><g data-component="broker" data-container="Kafka" data-x="1311" data-y="380" data-w="300" data-h="92"><rect x="1311" y="380" width="300" height="92" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1461" y="432.8">Kafka</tspan></text></g><line x1="28" x2="2020" y1="558" y2="558" stroke="#343a40" stroke-width="1"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="600">Điểm quan trọng</tspan></text><g data-note="important"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="632">Matching gọi Economy qua DI để debit DIA, rồi tăng priorityBoostMs trong PostgreSQL và đặt score Redis từ tổng boost. Wallet là ledger snapshot; LedgerTransaction.idempotencyKey unique ở DB.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="682">Lưu ý</tspan></text><g data-note="caution"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="714">Speed-up chỉ nhận ticket queued, giá server theo tier. Không có quota speed-up nghiệp vụ; technical HTTP throttle là hạ tầng chung. Kafka chỉ nhánh Economy outbox khi relay được bật. Kafka/stream chỉ khi Economy</tspan><tspan x="28" y="742">outbox relay được bật; không khẳng định có consumer nghiệp vụ.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="400" text-anchor="start" fill="#68a9e0"><tspan x="28" y="794">Nguồn: docs/services/matching-service.md · apps/core-api/src/modules/matching/matching.service.ts · docs/services/economy-service.md · Chi tiết: render-verification.json</tspan></text></svg>