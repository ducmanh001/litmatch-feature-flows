 sans-serif' font-size="18" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1388" y="127">PostgreSQL</tspan></text></g><g data-component="redis" data-container="Redis" data-x="1355" data-y="232" data-w="134" data-h="100"><path d="M 1355 247 V 317 C 1355 337 1489 337 1489 317 V 247 Z" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><ellipse cx="1422" cy="247" rx="67" ry="15" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="18" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1422" y="295">Redis</tspan></text></g><g data-component="gateway" data-container="signaling-gateway" data-x="1752" data-y="232" data-w="272" data-h="108"><rect x="1752" y="232" width="272" height="108" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1888" y="292.8">signaling-gateway</tspan></text></g><g data-component="livekit" data-container="media-server" data-x="1311" data-y="380" data-w="300" data-h="92"><rect x="1311" y="380" width="300" height="92" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1461" y="419.8">media-server</tspan><tspan x="1461" y="445.8">LiveKit</tspan></text></g><g data-component="storage" data-container="S3 / R2 / MinIO" data-x="1311" data-y="512" data-w="300" data-h="92"><rect x="1311" y="512" width="300" height="92" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1461" y="564.8">S3 / R2 / MinIO</tspan></text></g><g data-component="push" data-container="FCM / APNs / Web Push" data-x="1311" data-y="644" data-w="300" data-h="92"><rect x="1311" y="644" width="300" height="92" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1461" y="696.8">FCM / APNs / Web Push</tspan></text></g><g data-component="broker" data-container="Kafka" data-x="1311" data-y="776" data-w="300" data-h="92"><rect x="1311" y="776" width="300" height="92" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1461" y="828.8">Kafka</tspan></text></g><line x1="28" x2="2020" y1="1198" y2="1198" stroke="#343a40" stroke-width="1"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="1240">Điểm quan trọng</tspan></text><g data-note="important"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="1272">Friendship và Conversation có thể được tạo cùng transaction khi mutual-like. Profile chat cũng mở Conversation trước Friendship; PostgreSQL giữ message append-only, follow và trạng thái read/mute từng member.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="1322">Lưu ý</tspan></text><g data-note="caution"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="1354">Follow một chiều, Friendship và Conversation là ba khái niệm riêng. Chat không yêu cầu follow; friend call cần follow active hai chiều. Redis chỉ fanout, REST history là nguồn phục hồi. Kafka/stream chỉ khi Economy</tspan><tspan x="28" y="1382">outbox relay được bật; không khẳng định có consumer nghiệp vụ. Dây LiveKit–Redis dành cho self-host có cấu hình cluster; LiveKit Cloud do provider quản lý. Push cần provider/credential và endpoint phù hợp; in-app</tspan><tspan x="28" y="1410">vẫn ở PostgreSQL.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="400" text-anchor="start" fill="#68a9e0"><tspan x="28" y="1462">Nguồn: docs/services/friend-service.md · docs/services/streak-service.md · docs/services/media-service.md · Chi tiết: render-verification.json</tspan></text></svg>