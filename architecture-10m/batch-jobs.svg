<rect class="node" stroke="var(--muted)" x="40" y="90" width="270" height="96" rx="9"/>
<text class="nt" text-anchor="middle" x="175" y="114">Admin UI</text>
<text class="nl" text-anchor="middle" x="175" y="132">POST /admin/notifications/broadcast</text>
<text class="nl" text-anchor="middle" x="175" y="148">header Idempotency-Key (bắt buộc)</text>
<text class="nl" text-anchor="middle" x="175" y="164">POST …/:id/cancel (idempotent)</text>

<a href="../code-10m/33-admin-broadcast/01-post-broadcast.html">
<rect class="node" stroke="var(--t-service)" x="340" y="90" width="250" height="96" rx="9"/>
<text class="nt" text-anchor="middle" x="465" y="114">Xếp hàng broadcast (202)</text>
<text class="nl" text-anchor="middle" x="465" y="132">một dòng queued + audit</text>
<text class="nl" text-anchor="middle" x="465" y="148">trùng key → trả bản cũ</text>
<text class="nl" text-anchor="middle" x="465" y="164">khác nội dung → 409</text>
</a>
<a href="../code-10m/33-admin-broadcast/02-job-broadcast-dispatch-tick.html">
<rect class="node" stroke="var(--t-worker)" x="620" y="90" width="350" height="124" rx="9"/>
<text class="nt" text-anchor="middle" x="795" y="114">BroadcastDispatchJob (singleton)</text>
<text class="nl" text-anchor="middle" x="795" y="132">keyset theo users.id, lô 500 người</text>
<text class="nl" text-anchor="middle" x="795" y="148">thông báo + cursor + recipient_count CÙNG tx</text>
<text class="nl" text-anchor="middle" x="795" y="164">push SAU commit, 20 lời gọi đồng thời</text>
<text class="nl" text-anchor="middle" x="795" y="180">lô lỗi: retry rồi failed + audit</text>
</a>

<rect class="node" stroke="var(--t-external)" x="1000" y="90" width="240" height="96" rx="9"/>
<text class="nt" text-anchor="middle" x="1120" y="114">FCM / APNs / Web Push</text>
<text class="nl" text-anchor="middle" x="1120" y="132">best-effort, ngoài transaction</text>
<text class="nl" text-anchor="middle" x="1120" y="148">lỗi push không làm mất thông báo</text>


<path class="node" stroke="var(--t-postgres)" d="M340,298 a315,8 0 0 1 630,0 v74 a315,8 0 0 1 -630,0 z"/>
<path class="node" stroke="var(--t-postgres)" fill="none" d="M340,298 a315,8 0 0 0 630,0"/>
<text class="nt" text-anchor="middle" x="655" y="322">PostgreSQL</text>
<text class="nl" text-anchor="middle" x="655" y="340">notification_broadcasts: queued → running → done / failed / cancelled</text>
<text class="nl" text-anchor="middle" x="655" y="356">notifications (ghi cùng transaction với cursor) · users (keyset)</text>

<a href="../code-10m/20-short-video/01-post-record-view.html">
<rect class="node" stroke="var(--t-service)" x="40" y="470" width="280" height="100" rx="9"/>
<text class="nt" text-anchor="middle" x="180" y="494">Ghi lượt xem video</text>
<text class="nl" text-anchor="middle" x="180" y="512">POST /videos/:id/views</text>
<text class="nl" text-anchor="middle" x="180" y="528">đủ ngưỡng xem → +1 viewCount, một lần</text>
<text class="nl" text-anchor="middle" x="180" y="544">kể cả khi nhiều request cùng lúc</text>
</a>

<path class="node" stroke="var(--t-redis)" d="M350,466 a140,8 0 0 1 280,0 v108 a140,8 0 0 1 -280,0 z"/>
<path class="node" stroke="var(--t-redis)" fill="none" d="M350,466 a140,8 0 0 0 280,0"/>
<text class="nt" text-anchor="middle" x="490" y="490">Bộ đệm counter (Redis)</text>
<text class="nl" text-anchor="middle" x="490" y="508">HINCRBY + SADD trong một MULTI</text>
<text class="nl" text-anchor="middle" x="490" y="524">cờ VIDEO_COUNTER_BUFFER_ENABLED: tắt</text>
<text class="nl" text-anchor="middle" x="490" y="540">Redis lỗi → fail-open về DB</text>


<rect class="node" stroke="var(--t-worker)" x="660" y="470" width="270" height="100" rx="9"/>
<text class="nt" text-anchor="middle" x="795" y="494">Flush counter (singleton)</text>
<text class="nl" text-anchor="middle" x="795" y="512">một câu UPDATE … unnest cho cả lô</text>
<text class="nl" text-anchor="middle" x="795" y="528">thay vì một UPDATE mỗi lượt xem</text>

<a href="../code-10m/34-video-ranking/01-job-video-ranking-tick.html">
<rect class="node" stroke="var(--t-worker)" x="950" y="470" width="290" height="124" rx="9"/>
<text class="nt" text-anchor="middle" x="1095" y="494">Xếp hạng theo hạn (singleton)</text>
<text class="nl" text-anchor="middle" x="1095" y="512">rank_due_at ∝ (decay + tuổi),</text>
<text class="nl" text-anchor="middle" x="1095" y="528">kẹp trong [60 s, MAX_INTERVAL]</text>
<text class="nl" text-anchor="middle" x="1095" y="544">lô SKIP LOCKED, video trẻ trước</text>
</a>

