<path class="node" stroke="var(--t-postgres)" fill="none" d="M40,678 a600,8 0 0 0 1200,0"/>
<text class="nt" text-anchor="middle" x="640" y="702">PostgreSQL</text>
<text class="nl" text-anchor="middle" x="640" y="720">videos (view/like/comment counters, rank_score, rank_due_at; index ranked và rank_due) · video_views</text>
<text class="nl" text-anchor="middle" x="640" y="736">việc tỉ lệ với video trẻ và đang hoạt động, không tăng tuyến tính theo cả catalogue</text>

