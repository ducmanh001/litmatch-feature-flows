<path class="edge" d="M630,500 L660,500" stroke="var(--t-redis)" marker-end="url(#ah-redis)"/>
<path class="edge" d="M795,570 L795,617.5 Q795,620 792.5,620 L792.5,620 Q790,620 790,622.5 L790,670" stroke="var(--t-postgres)" marker-end="url(#ah-postgres)"/>
