<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="561" viewBox="0 0 2048 561" role="img" aria-label="Runtime Availability — Sơ đồ kiến trúc"><title>Runtime Availability — Sơ đồ kiến trúc</title><rect width="100%" height="100%" fill="#121314"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#666666" stroke-width="1.4"/></marker></defs><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="26" font-weight="700" text-anchor="start" fill="#83c3ff"><tspan x="24" y="38">Runtime Availability — Sơ đồ kiến trúc</tspan></text><path data-connector="true" data-edge="client-core" data-from="client" data-to="core" d="M 264 140 H 577" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-edge-caption="client-core" data-container="REST: yêu cầu nghiệp vụ" data-x="298.0771484375" data-y="122.5" data-w="244.845703125" data-h="35"><rect x="298.0771484375" y="122.5" width="244.845703125" height="35" rx="17.5" fill="#121314" stroke="#68a9e0" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="420.5" y="145.78">REST: yêu cầu nghiệp vụ</tspan></text></g><g data-component="client" data-container="Client: Web / Admin" data-x="18" data-y="104" data-w="246" data-h="100"><rect x="18" y="104" width="246" height="100" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="141" y="160.8">Client: Web / Admin</tspan></text></g><g data-component="core" data-container="core-api" data-x="577" data-y="56" data-w="328" data-h="152"><rect x="577" y="56" width="328" height="152" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="22" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="741" y="139.48">core-api</tspan></text></g><line x1="28" x2="2020" y1="294" y2="294" stroke="#343a40" stroke-width="1"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="336">Điểm quan trọng</tspan></text><g data-note="important"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="368">CapabilitiesService trong core-api suy contract từ cấu hình môi trường, credential presence và maintenance. Flow chỉ đọc và trả DTO; không có service availability độc lập hay dữ liệu bền vững mới.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="418">Lưu ý</tspan></text><g data-note="caution"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="450">Contract không phải health probe của provider và không chứng minh production readiness. Frontend dùng contract để hiển thị, endpoint nghiệp vụ vẫn giữ guard riêng.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="400" text-anchor="start" fill="#68a9e0"><tspan x="28" y="502">Nguồn: apps/core-api/src/app/capabilities.controller.ts · apps/core-api/src/app/capabilities.service.ts · apps/core-api/src/config/capabilities.ts · Chi tiết: render-verification.json</tspan></text></svg>