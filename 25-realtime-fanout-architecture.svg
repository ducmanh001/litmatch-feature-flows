4b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="18" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1388" y="127">PostgreSQL</tspan></text></g><g data-component="redis" data-container="Redis" data-x="1355" data-y="232" data-w="134" data-h="100"><path d="M 1355 247 V 317 C 1355 337 1489 337 1489 317 V 247 Z" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><ellipse cx="1422" cy="247" rx="67" ry="15" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="18" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1422" y="295">Redis</tspan></text></g><g data-component="gateway" data-container="signaling-gateway" data-x="1752" data-y="232" data-w="272" data-h="108"><rect x="1752" y="232" width="272" height="108" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1888" y="292.8">signaling-gateway</tspan></text></g><line x1="28" x2="2020" y1="482" y2="482" stroke="#343a40" stroke-width="1"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="524">Điểm quan trọng</tspan></text><g data-note="important"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="556">core-api quyết recipient/payload và publish sau durable commit; Redis Pub/Sub đưa envelope tới Gateway. Gateway verify JWT, quản lý Redis connection lease/presence và fanout room user từ JWT, không query DB hay</tspan><tspan x="28" y="584">quyết business.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="634">Lưu ý</tspan></text><g data-note="caution"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="666">Pub/Sub at-most-once không giữ lịch sử. Cluster adapter Socket.IO dùng connection Redis riêng; relay dùng server.local để tránh mỗi pod nhân đôi cùng event. Quota Redis lỗi thì handshake fail closed.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="400" text-anchor="start" fill="#68a9e0"><tspan x="28" y="718">Nguồn: docs/services/realtime-gateway.md · apps/signaling-gateway/src/app/signaling.gateway.ts · apps/signaling-gateway/src/app/connection-quota.service.ts · Chi tiết: render-verification.json</tspan></text></svg>