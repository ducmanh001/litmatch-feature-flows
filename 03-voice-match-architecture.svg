greSQL" data-x="1311" data-y="64" data-w="154" data-h="100"><path d="M 1311 79 V 149 C 1311 169 1465 169 1465 149 V 79 Z" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><ellipse cx="1388" cy="79" rx="77" ry="15" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="18" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1388" y="127">PostgreSQL</tspan></text></g><g data-component="redis" data-container="Redis" data-x="1355" data-y="232" data-w="134" data-h="100"><path d="M 1355 247 V 317 C 1355 337 1489 337 1489 317 V 247 Z" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><ellipse cx="1422" cy="247" rx="67" ry="15" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="18" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1422" y="295">Redis</tspan></text></g><g data-component="gateway" data-container="signaling-gateway" data-x="1752" data-y="232" data-w="272" data-h="108"><rect x="1752" y="232" width="272" height="108" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1888" y="292.8">signaling-gateway</tspan></text></g><g data-component="livekit" data-container="media-server" data-x="1311" data-y="380" data-w="300" data-h="92"><rect x="1311" y="380" width="300" height="92" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1461" y="419.8">media-server</tspan><tspan x="1461" y="445.8">LiveKit</tspan></text></g><line x1="28" x2="2020" y1="706" y2="706" stroke="#343a40" stroke-width="1"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="748">Điểm quan trọng</tspan></text><g data-note="important"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="780">Calling là module trong core-api; media-server triển khai LiveKit và không quyết định nghiệp vụ. PostgreSQL giữ CallSession, thời lượng và likes; client truyền audio trực tiếp qua LiveKit.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="830">Lưu ý</tspan></text><g data-note="caution"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="862">Identity, room và token do server chọn. Webhook phải xác minh chữ ký; ticker và REST reconciliation là backstop, còn Gateway chỉ báo call.ended qua Redis Pub/Sub. Dây LiveKit–Redis dành cho self-host có cấu hình</tspan><tspan x="28" y="890">cluster; LiveKit Cloud do provider quản lý.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="400" text-anchor="start" fill="#68a9e0"><tspan x="28" y="942">Nguồn: docs/services/calling-service.md · apps/media-server/livekit.yaml · apps/core-api/src/modules/calling/calling.module.ts · Chi tiết: render-verification.json</tspan></text></svg>