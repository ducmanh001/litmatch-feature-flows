<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="709" viewBox="0 0 2048 709" role="img" aria-label="Avatar tùy chỉnh — Sơ đồ kiến trúc"><title>Avatar tùy chỉnh — Sơ đồ kiến trúc</title><rect width="100%" height="100%" fill="#121314"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#666666" stroke-width="1.4"/></marker></defs><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="26" font-weight="700" text-anchor="start" fill="#83c3ff"><tspan x="24" y="38">Avatar tùy chỉnh — Sơ đồ kiến trúc</tspan></text><path data-connector="true" data-edge="client-core" data-from="client" data-to="core" d="M 264 140 H 577" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-edge-caption="client-core" data-container="REST: yêu cầu nghiệp vụ" data-x="298.0771484375" data-y="122.5" data-w="244.845703125" data-h="35"><rect x="298.0771484375" y="122.5" width="244.845703125" height="35" rx="17.5" fill="#121314" stroke="#68a9e0" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="420.5" y="145.78">REST: yêu cầu nghiệp vụ</tspan></text></g><path data-connector="true" data-edge="core-postgres" data-from="core" data-to="postgres" d="M 905 100 H 1311" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-edge-caption="core-postgres" data-container="state bền vững" data-x="1025.3876953125" data-y="82.5" data-w="165.224609375" data-h="35"><rect x="1025.3876953125" y="82.5" width="165.224609375" height="35" rx="17.5" fill="#121314" stroke="#68a9e0" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1108" y="105.78">state bền vững</tspan></text></g><path data-connector="true" data-edge="core-broker" data-from="core" data-to="broker" d="M 905 124 H 1074 V 282 H 1311" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-edge-caption="core-broker" data-container="stream (tuỳ cấu hình)" data-x="1083.586669921875" data-y="264.5" data-w="217.82666015625" data-h="35"><rect x="1083.586669921875" y="264.5" width="217.82666015625" height="35" rx="17.5" fill="#121314" stroke="#68a9e0" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1192.5" y="287.78">stream (tuỳ cấu hình)</tspan></text></g><g data-component="client" data-container="Client: Web / Admin" data-x="18" data-y="104" data-w="246" data-h="100"><rect x="18" y="104" width="246" height="100" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="141" y="160.8">Client: Web / Admin</tspan></text></g><g data-component="core" data-container="core-api" data-x="577" data-y="56" data-w="328" data-h="152"><rect x="577" y="56" width="328" height="152" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="22" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="741" y="139.48">core-api</tspan></text></g><g data-component="postgres" data-container="PostgreSQL" data-x="1311" data-y="64" data-w="154" data-h="100"><path d="M 1311 79 V 149 C 1311 169 1465 169 1465 149 V 79 Z" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><ellipse cx="1388" cy="79" rx="77" ry="15" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="18" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1388" y="127">PostgreSQL</tspan></text></g><g data-component="broker" data-container="Kafka" data-x="1311" data-y="236" data-w="300" data-h="92"><rect x="1311" y="236" width="300" height="92" rx="26" fill="#0d273f" stroke="#1c354b" stroke-width="2"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="600" text-anchor="middle" fill="#83c3ff"><tspan x="1461" y="288.8">Kafka</tspan></text></g><line x1="28" x2="2020" y1="414" y2="414" stroke="#343a40" stroke-width="1"/><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="456">Điểm quan trọng</tspan></text><g data-note="important"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="488">Avatar module sở hữu catalog, UserAvatarItem và config năm slots trong PostgreSQL. Item trả phí gọi Economy qua DI; client chỉ ghép layer theo zIndex và không quyết định giá hay ownership.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="21" font-weight="700" text-anchor="start" fill="#b8bec5"><tspan x="28" y="538">Lưu ý</tspan></text><g data-note="caution"><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="20" font-weight="400" text-anchor="start" fill="#b8bec5"><tspan x="28" y="570">Ledger append-only là nguồn sự thật của debit, Wallet là snapshot. Mua rồi ghi ownership là hai bước idempotent; trang bị phải kiểm tra asset active, đúng slot và thuộc user. Kafka/stream chỉ khi Economy outbox relay</tspan><tspan x="28" y="598">được bật; không khẳng định có consumer nghiệp vụ.</tspan></text></g><text font-family='"trebuchet ms", verdana, arial, sans-serif' font-size="17" font-weight="400" text-anchor="start" fill="#68a9e0"><tspan x="28" y="650">Nguồn: docs/services/avatar-service.md · docs/services/economy-service.md · apps/core-api/src/modules/avatar/avatar.module.ts · Chi tiết: render-verification.json</tspan></text></svg>